$kind: http-request
name: Update Service
method: PUT
url: '{{baseUrl}}/api/admin/services/{{serviceId}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Premium Salon",
      "category": "Beauty",
      "price": 150
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
