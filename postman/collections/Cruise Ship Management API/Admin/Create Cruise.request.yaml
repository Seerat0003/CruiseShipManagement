$kind: http-request
name: Create Cruise
method: POST
url: '{{baseUrl}}/api/admin/cruises'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ocean Serenity",
      "route": "Miami → Caribbean",
      "start_date": "2025-07-01",
      "duration_days": 7,
      "total_seats": 200,
      "price": 1500,
      "image_url": "https://example.com/cruise.jpg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Cruise created", () => pm.expect(pm.response.json().message).to.eql("Cruise created"));
