$kind: http-request
name: Update Booking Status
method: PUT
url: '{{baseUrl}}/api/admin/bookings/{{bookingId}}'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Confirmed"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
