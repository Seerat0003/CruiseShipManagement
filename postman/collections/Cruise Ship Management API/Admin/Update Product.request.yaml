$kind: http-request
name: Update Product
method: PUT
url: '{{baseUrl}}/api/admin/products/{{productId}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Sparkling Water",
      "category": "Catering",
      "price": 6,
      "stock": 80
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
