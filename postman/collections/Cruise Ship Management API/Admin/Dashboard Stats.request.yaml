$kind: http-request
name: Dashboard Stats
method: GET
url: '{{baseUrl}}/api/admin/stats'
order: 11000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Has users count", () => pm.expect(pm.response.json()).to.have.property('users'));
